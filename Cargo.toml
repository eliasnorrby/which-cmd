[package]
name = "which-cmd"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wcmd"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
crossterm = "0.29"
console = "0.15"
clap = { version = "4.5", features = ["derive"] }
xdg = "2.5"
fuzzy-matcher = "0.3"
thiserror = "1.0"
libc = "0.2"

[dev-dependencies]
tempfile = "3.24.0"
